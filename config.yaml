name: radeon-cloud
version: 1.0.2
description: Operate the free AMD Radeon Cloud GPU workstation (48 GB VRAM gfx1100, one box via your radeon-cloud SSH alias) over a safe SSH CLI. Register and claim free GPU hours via the official setup guide before first use.
# Running commands on your box is the point of this skill, but it must never
# happen behind your back. Interactive use prompts once before connecting.
# Scripted use (CI, another agent, a pipe) is refused unless you set this to
# true, or export RC_ALLOW_UNATTENDED=1 for the current shell.
allow_unattended: false
triggers:
  - radeon-cloud
  - Radeon cloud
  - Radeon 云
  - ROCm 远程
  - 远程 GPU
  - 远程训练
  - GPU 显存
category: developer-tools
requires_third_party_api_keys: false
