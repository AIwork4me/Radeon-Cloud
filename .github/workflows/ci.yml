name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m py_compile scripts/rc.py scripts/journey_check.py scripts/install.py scripts/build_dist.py
      - name: Install the skill into an isolated test home
        env:
          HOME: ${{ runner.temp }}/workbuddy-home
        run: python scripts/install.py
      - name: Run static package review
        env:
          HOME: ${{ runner.temp }}/workbuddy-home
        run: python scripts/journey_check.py --phase review
      - name: Check package synchronization (source <-> installed)
        env:
          HOME: ${{ runner.temp }}/workbuddy-home
        run: python scripts/install.py --check
      - name: Check dist directory synchronization (source <-> dist)
        run: python scripts/install.py --check --dest dist/radeon-cloud-connector
      - name: Build and verify release ZIP
        run: python scripts/build_dist.py
